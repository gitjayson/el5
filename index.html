<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>el5.io</title>
<meta name="description" content="el5 — crypto market structure visualization. invite-only beta.">
<meta name="theme-color" content="#07070d">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root {
  --bg: #07070d;
  --panel: rgba(10, 10, 20, 0.55);
  --border: rgba(122, 138, 255, 0.18);
  --text: #e8e8ff;
  --muted: #7a8aff;
  --dim: #3a3a55;
  --magenta: #ff10f0;
  --green: #39ff14;
  --cyan: #00f0ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  position: relative;
}
.static {
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(rgba(122,138,255,0.18) 1px, transparent 1.2px),
    radial-gradient(rgba(255,16,240,0.10) 1px, transparent 1.4px),
    radial-gradient(rgba(57,255,20,0.06) 1px, transparent 1.6px);
  background-size: 3px 3px, 5px 5px, 7px 7px;
  background-position: 0 0, 1px 2px, 2px 4px;
  opacity: 0.65;
  pointer-events: none;
  z-index: 0;
  animation: jitter 0.12s steps(4) infinite;
}
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.28) 2px,
    rgba(0,0,0,0.28) 3px
  );
  pointer-events: none;
  z-index: 1;
}
@keyframes jitter {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-1px, 1px); }
  50% { transform: translate(1px, -1px); }
  75% { transform: translate(-1px, -1px); }
  100% { transform: translate(1px, 1px); }
}
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: calc(18px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) 18px calc(24px + env(safe-area-inset-left));
  z-index: 10;
}
.wordmark {
  color: var(--magenta);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.32em;
}
.tagline {
  color: var(--dim);
  font-size: 11px;
  letter-spacing: 0.22em;
}
main {
  position: relative;
  z-index: 5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
}
.gate {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 28px 36px;
  background: var(--panel);
  border: 1px solid var(--border);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  min-width: 320px;
}
.gate-label {
  font-size: 10px;
  letter-spacing: 0.32em;
  color: var(--muted);
}
.gate-input {
  width: 240px;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
  outline: none;
  caret-color: var(--magenta);
}
.gate-input:focus {
  border-color: var(--magenta);
  background: rgba(255, 16, 240, 0.04);
}
.gate-input.error {
  border-color: #ff5500;
  animation: shake 0.32s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.gate-hint {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--dim);
}
.gate-link {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px dotted var(--muted);
  padding-bottom: 1px;
}
.gate-link:hover { color: var(--cyan); border-bottom-color: var(--cyan); }
footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 14px calc(24px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--dim);
  z-index: 10;
}
footer a { color: inherit; text-decoration: none; }
footer a:hover { color: var(--muted); }
.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 8px;
  vertical-align: middle;
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
#revealed { display: none; }
body.granted .gate { display: none; }
body.granted #revealed {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 36px 44px;
  background: var(--panel);
  border: 1px solid var(--border);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
body.granted .static { opacity: 0.30; }
.granted-headline {
  font-size: 14px;
  letter-spacing: 0.28em;
  color: var(--magenta);
}
.enter-btn {
  display: inline-block;
  padding: 14px 28px;
  background: transparent;
  border: 1px solid var(--magenta);
  color: var(--magenta);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.16s, color 0.16s, transform 0.08s;
}
.enter-btn:hover {
  background: var(--magenta);
  color: #0a0a14;
}
.enter-btn:active { transform: scale(0.97); }
.granted-sub {
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--dim);
}
@media (max-width: 480px) {
  .gate-input { width: 200px; }
  .gate, #revealed { padding: 20px 24px; min-width: 280px; }
  header { padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 14px calc(16px + env(safe-area-inset-left)); }
  footer { padding: 12px calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); font-size: 9px; }
}
</style>
</head>
<body>

<div class="static" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<header>
  <div class="wordmark">EL5.IO</div>
  <div class="tagline">NO SIGNAL · ALL STRUCTURE</div>
</header>

<main>
  <form class="gate" id="gate" autocomplete="off">
    <div class="gate-label">▌ ACCESS</div>
    <input type="text" id="code" class="gate-input" placeholder="ENTER CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="gate-hint">INVITE-ONLY BETA</div>
    <a class="gate-link" href="mailto:support@el5.io?subject=el5%20access%20request">REQUEST ACCESS →</a>
  </form>

  <div id="revealed">
    <div class="granted-headline">▌ ACCESS GRANTED</div>
    <a class="enter-btn" href="dashboard.html">ENTER DASHBOARD ↗</a>
    <div class="granted-sub">LIVE CRYPTO STRUCTURE · BTC FOCUS · 12 ALTS</div>
  </div>
</main>

<footer>
  <span><span class="live-dot"></span>EL5.IO · BETA</span>
  <span><a href="privacy.html">PRIVACY</a> · <a href="support.html">SUPPORT</a> · <a href="https://hacktrader.com">HACKTRADER ↗</a></span>
</footer>

<script>
(async function () {
  const ACCESS_HASH = "0e19f02ca15d6060d63dc1946cc784d739c69a4cc5e6ef266a50e3b58c673f35";
  const GRANTED_KEY = "el5_access_granted";

  async function sha256(text) {
    const buf = new TextEncoder().encode(text.toUpperCase().trim());
    const hash = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2, "0")).join("");
  }

  if (localStorage.getItem(GRANTED_KEY) === "1") {
    document.body.classList.add("granted");
    return;
  }

  const form = document.getElementById("gate");
  const input = document.getElementById("code");
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const candidate = input.value;
    const hash = await sha256(candidate);
    if (hash === ACCESS_HASH) {
      localStorage.setItem(GRANTED_KEY, "1");
      document.body.classList.add("granted");
    } else {
      input.classList.add("error");
      input.value = "";
      input.placeholder = "DENIED · TRY AGAIN";
      setTimeout(() => input.classList.remove("error"), 400);
    }
  });
  input.focus();
})();
</script>
</body>
</html>
