<title>el5 crypto radar — concept mockup</title>
<desc>Cyberpunk-styled radial correlation visualization for crypto tokens, with TV-static texture, neon palette, and crypto-native dimensions: trading session arc, stablecoin proximity orbs, fear-greed ring, and an active scanning sweep.</desc>
<defs>
